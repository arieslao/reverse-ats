excluded:
  # Confirmed no public structured ATS board, not just unresolved (2026-10-18
  # research pass). Kept here so a future refresh doesn't re-probe them.
  - name: "Bionaut Labs"
    reason: "site is a bare splash page; no Greenhouse/Lever/Ashby/SmartRecruiters board found"
    careers_url: "https://www.bionautlabs.com/careers"
  - name: "Electronic Arts (EA / Respawn)"
    reason: "uses Avature (not one of the 5 fetchers this loader supports)"
    careers_url: "https://www.ea.com/careers"
  - name: "Open Actuation"
    reason: "apply via email only (careers@openactuation.com), no ATS"
    careers_url: "https://www.ycombinator.com/companies/open-actuation"
  - name: "Inflection Space Systems"
    reason: "apply via email only, no ATS"
    careers_url: "https://www.ycombinator.com/companies/inflection-space-systems"
  - name: "Honeylove"
    reason: "careers page renders no job content; no ATS link found (jobs surface only on third-party aggregators)"
    careers_url: "https://www.honeylove.com/pages/careers"
  - name: "Funktronic Labs"
    reason: "single-page studio splash site, no careers section at all"
    careers_url: "http://funktroniclabs.com/"
  - name: "Product.ai"
    reason: "proprietary apply flow (video + trial), no ATS link"
    careers_url: "https://product.ai/join/careers/"
  - name: "Whatnot"
    reason: "hosted Ashby board page exists (jobs.ashbyhq.com/whatnot) but the public posting-api endpoint 404s; needs an embedded-JSON scraper to re-add, not built in this pass"
    careers_url: "https://www.whatnot.com/careers"
  - name: "Apple"
    reason: "jobs.apple.com's search API requires an authenticated session (401 Unauthorized on a plain request); the job-detail endpoint works once you have a real job id, but there's no public way to list ids. Matches this repo's existing scraper/job_scraper.py COMPANIES entry, which also marks Apple custom."
    careers_url: "https://jobs.apple.com/en-us/search?location=los-angeles-metro-area-LAMETRO"
  - name: "Meta"
    reason: "metacareers.com is a GraphQL app with no public unauthenticated endpoint found; matches the existing custom entry in scraper/job_scraper.py"
    careers_url: "https://www.metacareers.com/"
  - name: "Microsoft"
    reason: "careers.microsoft.com's search API did not respond to a direct probe (likely requires browser-origin headers/auth); matches the existing custom entry in scraper/job_scraper.py"
    careers_url: "https://careers.microsoft.com/"
  - name: "TikTok"
    reason: "careers.tiktok.com's search API redirects (302) rather than returning JSON directly; needs browser-session handling not built in this pass"
    careers_url: "https://careers.tiktok.com/"
  - name: "Google"
    reason: "careers.google.com's public API paths tried all returned 404; matches the existing custom entry in scraper/job_scraper.py"
    careers_url: "https://www.google.com/about/careers/"
