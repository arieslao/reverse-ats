# LA-based company career sites to scrape and match daily.
# Source: owner-supplied "LA Based Company Career Site List.csv" (2026-10-18).
# Each entry's ats/slug (or workday tenant/host/site) was VERIFIED by a live
# API probe before being added here — see scripts/README.md for the method
# and scripts/la_companies_resolution_notes.md for the evidence trail.
#
# ats: greenhouse | lever | ashby | smartrecruiters | workday
# slug: required for greenhouse/lever/ashby/smartrecruiters
# workday: {tenant, host, site} — required for ats: workday
#
# `excluded:` below lists companies with no public structured job-board API
# (confirmed, not just unresolved) — the loader does not fetch them, but they
# stay listed here so the next refresh knows what was already checked and why.

